<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; padding: 15px; color: #333; }
      .field { margin-bottom: 15px; }
      label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; }
      input[type="date"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
      .btn-container { text-align: right; margin-top: 20px; }
      button { background-color: #1b5e20; color: white; border: none; padding: 10px 18px; font-weight: bold; border-radius: 4px; cursor: pointer; }
      button:hover { background-color: #144417; }
      #loading { display: none; margin-top: 10px; font-size: 12px; color: #666; font-style: italic; }
    </style>
  </head>
  <body>
    <h3>📅 Relatório por Período e Formato</h3>
    <div class="field">
      <label for="dataInicio">Data Inicial:</label>
      <input type="date" id="dataInicio">
    </div>
    <div class="field">
      <label for="dataFim">Data Final:</label>
      <input type="date" id="dataFim">
    </div>
    <div id="loading">Gerando matriz por datas e formatos... aguarde.</div>
    <div class="btn-container">
      <button onclick="enviarPeriodo()">Gerar Relatório</button>
    </div>

    <script>
      function enviarPeriodo() {
        const inicio = document.getElementById('dataInicio').value;
        const fim = document.getElementById('dataFim').value;
        
        if (!inicio || !fim) {
          alert('Por favor, selecione a data inicial e a data final.');
          return;
        }

        document.getElementById('loading').style.display = 'block';

        google.script.run
          .withSuccessHandler(() => {
            google.script.host.close();
          })
          .withFailureHandler((err) => {
            alert('Erro: ' + err.message);
            document.getElementById('loading').style.display = 'none';
          })
          .gerarMatrizPorDatasECategorias(inicio, fim);
      }
    </script>
  </body>
</html>
